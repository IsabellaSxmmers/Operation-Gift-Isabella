main{max-width:700px;margin:0 auto}

.badge.hot{background:var(--accent);border-color:var(--accent);color:#FFF6E6}
.quip{margin:14px 0 0;font-size:18px}

h2{font-size:25px;font-weight:700;margin:34px 0 14px;display:flex;align-items:center;gap:14px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}

.card h3{font-size:20px;font-weight:700}
.card p{margin:0;color:var(--muted);font-size:15px}
.price{font-weight:600;font-variant-numeric:tabular-nums;color:var(--green)}
.note{font:600 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.check{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--gold);padding:14px 18px}
.check p{margin:0}
.more{text-align:center;border:1px solid var(--gold);background:var(--surface);padding:26px 18px;margin-top:34px;outline:1px solid var(--line);outline-offset:4px}
.more h2{justify-content:center;margin:0 0 6px}

.hero{border:1px solid var(--gold);background:var(--surface);padding:34px 22px;text-align:center;outline:1px solid var(--line);outline-offset:5px}

textarea{width:100%;min-height:130px;margin-top:14px;font:15px/1.5 var(--body);background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:12px}

   <h1>${esc(q.title)}</h1>
   <p class="sub">Question ${step+1} of ${QUESTIONS.length}</p>
   <ul class="opts">${q.opts.map(o=>`<li><button type="button" class="opt" data-id="${o[0]}" aria-pressed="${ans[q.key]===o[0]}"><b>${esc(o[1])}</b>${o[2]?`<span>${esc(o[2])}</span>`:''}</button></li>`).join('')}</ul>
   <div class="nav">${step>0?'<button class="link" id="back" type="button">Back</button>':''}</div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    ans[q.key]=b.dataset.id;
    if(step<QUESTIONS.length-1){step++;render()}else{step=QUESTIONS.length;render()}
  });
  const back=document.getElementById('back'); if(back)back.onclick=()=>{step--;render()};
}
const PINS={sibling:'LittleBigPlanet soundtrack on vinyl',parent:'Journaling Bible',grand:'Journaling Bible'};
const pinFor=()=>GIFTS.find(g=>g.name===PINS[ans.role]);
function pickGifts(){
  const pin=pinFor();
  const want=pin?2:3;
  const timeOk=g=>ans.timing==='panic'?g.fast:ans.timing==='proc'?!g.plan:true;
  const notes={};
  // Only gifts whose price fits the chosen bracket. Gift cards fit any bracket.
  let pool=GIFTS.filter(g=>g.m===ans.mission&&inBracket(g,ans.price));
  if(pool.length<want){
    // Not enough in this category: borrow gift cards and cash from other categories.
    const extra=GIFTS.filter(g=>g.any&&g.m!==ans.mission&&!pool.includes(g)).sort(()=>Math.random()-.5);
    extra.slice(0,want-pool.length).forEach(g=>{notes[g.name]='Gift card, any amount';pool.push(g)});
  }
  const scored=pool.map(g=>{
    let s=Math.random()*0.9;
    if(!timeOk(g)){s-=10;notes[g.name]='Needs lead time'}
    else if(ans.timing==='over'&&g.plan){s+=2;notes[g.name]='Plan-ahead pick'}
    if(ans.ghost==='past'&&g.sent)s+=2;
    if(ans.ghost==='present'&&g.fast)s+=1;
    if(ans.ghost==='scrooge')s-=(g.any?0:g.lo)/100;
    return {g,s};
  }).sort((a,b)=>b.s-a.s).slice(0,want);
  const list=scored.map(x=>x.g);
  if(pin)list.unshift(pin);
  return {list,notes};
}
function planText(list){
  return `Gift plan for Isabella\nFrom: ${ROLE_LABEL[ans.role]} (${GHOST_LABEL[ans.ghost]}, ${TIMING[ans.timing].label})\nMission: ${MISSION_LABEL[ans.mission]}, ${PRICE_LABEL[ans.price]}\n\n`+list.map(g=>`- ${g.name}: ${g.d}${g.links.length?' '+g.links.map(l=>l[1]).join(' '):''}`).join('\n');
}
const linkHtml=g=>g.links.length?`<div class="links">${g.links.map(l=>`<a href="${esc(l[1])}" target="_blank" rel="noopener">${esc(l[0])}</a>`).join('')}</div>`:'';
function fullListHtml(){
  return Object.keys(MISSION_LABEL).map(m=>`<h3>${esc(MISSION_LABEL[m])}</h3><ul class="full-list">${GIFTS.filter(g=>g.m===m).map(g=>`<li><b>${esc(g.name)}</b><span>${esc(g.d)}</span>${linkHtml(g)}</li>`).join('')}</ul>`).join('');
}
function renderResults(){
  const {list,notes}=pickGifts();
  app.innerHTML=`
   <div class="eyebrow">Your result</div>
   <h1>${esc(HEADLINE[ans.role]||('You are the '+ROLE_LABEL[ans.role]+'.'))}</h1>
   <div class="badges">
     <span class="badge hot">${esc(MISSION_LABEL[ans.mission])}</span>
     <span class="badge">${esc(PRICE_LABEL[ans.price])}</span>
     <span class="badge">${esc(TIMING[ans.timing].label)}</span>
     <span class="badge">${esc(GHOST_LABEL[ans.ghost])}</span>
   </div>
   <p class="quip">${esc(ROLE_QUIP[ans.role])}</p>
   <p class="quip">${esc(GHOST_QUIP[ans.ghost])}</p>
   <h2>Your gift ideas for Isabella</h2>
   <div class="grid">${list.map(g=>`
     <article class="card">
       ${notes[g.name]?`<div class="note">${esc(notes[g.name])}</div>`:''}
       <h3>${esc(g.name)}</h3>
       <p>${esc(g.d)}</p>
       ${linkHtml(g)}
     </article>`).join('')}</div>
   <section class="more"><h2>Want more ideas?</h2><p>Browse Isabella&rsquo;s full Christmas list.</p>
     <button class="btn" id="showall" type="button" aria-expanded="false" aria-controls="full">View the full list here</button></section>
   <div id="full" hidden>${fullListHtml()}</div>
   <div class="actions">
     <button class="btn" id="copy" type="button">Copy my gift plan</button>
     <button class="btn alt" id="redo" type="button">Retake the quiz</button>
     <span class="toast" id="toast" role="status"></span>
   </div>
   <div id="fallback"></div>`;
  document.getElementById('redo').onclick=()=>{ans={};step=-1;render()};
  document.getElementById('showall').onclick=e=>{
    const f=document.getElementById('full'),open=f.hidden;
    f.hidden=!open;e.target.setAttribute('aria-expanded',open);
    e.target.textContent=open?'Hide the full list':'View the full list here';
    if(open)f.scrollIntoView({behavior:'smooth',block:'start'});
  };
  document.getElementById('copy').onclick=async()=>{
    const t=planText(list),toast=document.getElementById('toast');
    try{await navigator.clipboard.writeText(t);toast.textContent='Copied. Paste it into a text to Isabella.'}
    catch(e){
      document.getElementById('fallback').innerHTML='<textarea id="plan" readonly></textarea>';
      const ta=document.getElementById('plan');ta.value=t;ta.focus();ta.select();
      toast.textContent='Select and copy the text below.';
    }
  };
}
function render(){ step<0?renderIntro():step>=QUESTIONS.length?renderResults():renderStep(); window.scrollTo({top:0}) }
render();
</script>
